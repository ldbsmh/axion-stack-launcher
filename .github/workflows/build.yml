name: Build Axion-Stack Launcher

on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [ main ]
  schedule:
    - cron: '0 22 * * 0'    # 每周日探测上游更新并重建

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Lawnchair 16 (Android 17 / SDK 37)
        uses: actions/checkout@v4
        with:
          repository: LawnchairLauncher/lawnchair
          ref: 16-dev
          fetch-depth: 1
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK (with Quickstep)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleLawnWithQuickstepGithubRelease --no-daemon \
            -x lint \
            --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lawnchair-16-apks
          path: |
            build/outputs/apk/**/*.apk
            build/outputs/*.apk
          if-no-files-found: error