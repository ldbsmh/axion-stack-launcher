name: Build Axion-Stack Launcher

on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [ main ]
  schedule:
    - cron: '0 22 * * 0'    # 每周日探测上游更新并重建

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 与官方 Lawnchair CI 一致的有效变体名
        build-variant: [ assembleLawnWithQuickstepNightlyRelease ]
    steps:
      - name: Checkout patch sources (axion-stack-launcher)
        uses: actions/checkout@v7
        with:
          path: patches-repo

      - name: Checkout Lawnchair 16 (Android 17 / SDK 37)
        uses: actions/checkout@v7
        with:
          repository: LawnchairLauncher/lawnchair
          ref: 16-dev
          submodules: recursive
          path: lawnchair

      - name: Apply Axion-Stack patches
        run: |
          PATCHES="$GITHUB_WORKSPACE/patches-repo/patches/quickstep/src/com/android/quickstep"
          TARGET="lawnchair/quickstep/src/com/android/quickstep"
          cp -v $PATCHES/views/AxStack*.java      $TARGET/views/
          cp -v $PATCHES/views/AxTaskViewTransform.java $TARGET/views/
          cp -v $PATCHES/util/AxAnimationEngine.java    $TARGET/util/
          cp -v $PATCHES/util/AxWallpaperZoom.java      $TARGET/util/
          cp -v $PATCHES/views/TaskView.kt         $TARGET/views/
          cp -v $PATCHES/views/TaskViewIcon.java   $TARGET/views/
          cp -v $PATCHES/views/IconView.kt         $TARGET/views/
          cp -v $PATCHES/views/IconAppChipView.kt  $TARGET/views/
          cp -v $PATCHES/views/LauncherRecentsView.java $TARGET/views/
          cp -v $PATCHES/views/RecentsView.java    $TARGET/views/
          echo "--- patched files ---"
          ls -la $TARGET/views/AxStack* $TARGET/util/Ax*

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Release APK (with Quickstep)
        working-directory: lawnchair
        run: ./gradlew ${{ matrix.build-variant }}

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.build-variant }}
          path: lawnchair/build/outputs/apk/**/*.apk
          if-no-files-found: error