name: Build Axion-Stack Launcher

on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [ main ]
  schedule:
    - cron: '0 22 * * 0'    # 每周日探测上游更新并重建

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 与官方 Lawnchair CI 一致的有效变体名
        build-variant: [ assembleLawnWithQuickstepNightlyRelease ]
    steps:
      - name: Checkout Lawnchair 16 (Android 17 / SDK 37)
        uses: actions/checkout@v7
        with:
          repository: LawnchairLauncher/lawnchair
          ref: 16-dev
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Release APK (with Quickstep)
        run: ./gradlew ${{ matrix.build-variant }}

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.build-variant }}
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error